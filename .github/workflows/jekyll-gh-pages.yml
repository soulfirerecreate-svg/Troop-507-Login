<style>
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --scout-green: #274020;
    --scout-green-hover: #1c3016;
    --scout-tan: #d6c7a7;
    --scout-card-bg: #f5eedc;
    --scout-gold: #c69214;
    --scout-border: #b8a682;
    --text-dark: #1c2419;
    --text-muted: #5c5543;
    --error-color: #ba2d2d;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
  }

  /* Dedicated container wrapper for the background image */
  .page-wrapper {
    width: 100%;
    min-height: 100vh;
    background-color: var(--scout-tan);
    
    /* REPLACE 'YOUR_BACKGROUND_IMAGE_URL_HERE' WITH YOUR BACKGROUND IMAGE LINK */
    background-image: linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.35)), url('https://lh3.googleusercontent.com/u/0/d/1agV2zmSAJHRmEkjYv5sbCI6U66B5Lptb');
    
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }

  .login-card {
    background: var(--scout-card-bg);
    width: 100%;
    max-width: 400px;
    padding: 36px 32px;
    border-radius: 16px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    border: 2px solid var(--scout-border);
    text-align: center;
  }

  .troop-logo {
    max-width: 120px;
    height: auto;
    margin-bottom: 12px;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
  }

  .login-header h2 {
    font-family: 'Montserrat', sans-serif;
    color: var(--scout-green);
    margin: 0 0 4px 0;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .login-header p {
    margin: 0 0 24px 0;
    font-size: 0.875rem;
    color: var(--text-muted);
    font-weight: 500;
  }

  .form-group {
    margin-bottom: 18px;
    text-align: left;
  }

  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--scout-green);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 0.95rem;
    background-color: #ffffff;
    border: 1.5px solid var(--scout-border);
    border-radius: 8px;
    outline: none;
    transition: all 0.2s ease;
    font-family: inherit;
    color: var(--text-dark);
  }

  input[type="text"]:focus,
  input[type="password"]:focus {
    border-color: var(--scout-gold);
    box-shadow: 0 0 0 3px rgba(198, 146, 20, 0.25);
  }

  input:disabled {
    background-color: #e8e2d3;
    opacity: 0.7;
    cursor: not-allowed;
  }

  button[type="submit"] {
    width: 100%;
    height: 48px;
    margin-top: 10px;
    background-color: var(--scout-green);
    color: #ffffff;
    border: none;
    border-radius: 8px;
    font-family: 'Montserrat', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 10px rgba(39, 64, 32, 0.2);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  button[type="submit"]:hover:not(:disabled) {
    background-color: var(--scout-green-hover);
    transform: translateY(-1px);
  }

  button[type="submit"]:disabled {
    opacity: 0.85;
    cursor: wait;
  }

  .spinner {
    width: 20px;
    height: 20px;
    border: 3px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top-color: #ffffff;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .error-message {
    color: var(--error-color);
    font-size: 0.85rem;
    margin-top: 14px;
    min-height: 20px;
    font-weight: 600;
  }
</style>

<div class="page-wrapper">
  <div class="login-card">
    <img src="https://lh3.googleusercontent.com/u/0/d/1zdQqbhhH9XONqSzMmxdfikfyuTyOTBku" alt="Troop 507 Logo" class="troop-logo">

    <div class="login-header">
      <h2>TROOP 507</h2>
      <p>Sign in to Access Troop Pages</p>
    </div>

    <form id="loginForm" onsubmit="validateLogin(event)" autocomplete="off">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username" oninput="clearError()" autocomplete="off" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" oninput="clearError()" autocomplete="new-password" required>
      </div>

      <button type="submit" id="submitBtn">
        <span id="btnText">SIGN IN</span>
      </button>

      <div id="error-message" class="error-message"></div>
    </form>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzndsyD1mCW34BRtGKWSURFULTQvB9TkvpGA4OVBgTfMroFpsLDLfzqjbFnyV15f2s/exec"; 

  let errorTimer = null;

  async function validateLogin(event) {
    event.preventDefault(); 
    
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const errorDiv = document.getElementById("error-message");
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");
    
    clearTimeout(errorTimer);

    submitBtn.disabled = true;
    usernameInput.disabled = true;
    passwordInput.disabled = true;
    btnText.innerHTML = '<div class="spinner"></div>';

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          username: usernameInput.value.trim(),
          password: passwordInput.value
        })
      });

      const result = await response.json();

      if (result.success) {
        errorDiv.textContent = "";
        usernameInput.value = "";
        passwordInput.value = "";
        window.open(result.url, '_blank'); 
      } else {
        errorDiv.textContent = result.message || "Invalid username or password.";
        errorTimer = setTimeout(() => { errorDiv.textContent = ""; }, 3000);
      }
    } catch (err) {
      errorDiv.textContent = "Unable to connect. Please try again.";
      errorTimer = setTimeout(() => { errorDiv.textContent = ""; }, 3000);
    } finally {
      submitBtn.disabled = false;
      usernameInput.disabled = false;
      passwordInput.disabled = false;
      btnText.innerHTML = "SIGN IN";
    }
  }

  function clearError() {
    document.getElementById("error-message").textContent = "";
    clearTimeout(errorTimer);
  }
</script>
